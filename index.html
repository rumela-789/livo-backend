<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vimline</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Fraunces:ital,wght@1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#090c10;--panel:#0f1318;--panel2:#161b22;--line:rgba(233,230,223,.10);--line2:rgba(233,230,223,.32);--txt:#e9e6df;--dim:#828a94}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Manrope,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(9,12,16,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;gap:10px;padding:10px 14px 6px;align-items:center}
.sp{flex:1}
.sr{padding:0 14px 8px}
.brand{font:600 24px/1 Sora,"Manrope",system-ui,sans-serif;letter-spacing:-.04em;color:var(--txt)}
input,select{background:#06080b;border:1px solid var(--line);color:var(--txt);border-radius:12px;font:inherit;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
input{flex:1;min-width:0;padding:11px 14px}
#q{width:100%;height:38px;padding:0 14px;font-size:15px}
input::placeholder{color:var(--dim)}
input:focus,select:focus{outline:none;border-color:var(--line2)}
button{background:linear-gradient(180deg,#1b2129,#0f1318);border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:12px;font:500 14px Manrope,sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 14px rgba(0,0,0,.45);transition:border-color .15s,transform .1s}
button:hover{border-color:var(--line2)}
button:active{background:#000;transform:scale(.97)}
button:focus-visible{outline:1px solid var(--line2);outline-offset:2px}
#plus{width:42px;height:42px;padding:0;font-size:20px;font-weight:300;line-height:1;flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:8px 15px;border-radius:999px;box-shadow:none;background:transparent;color:var(--dim)}
.tabs button.on{background:#000;color:var(--txt);border-color:var(--line2);box-shadow:0 0 18px rgba(255,255,255,.05)}
#player{background:#000;position:sticky;top:110px;z-index:4;display:none;border-bottom:1px solid var(--line)}
#player.show{display:block}
video{width:100%;max-height:42vh;display:block;background:#000}
#now{padding:8px 14px;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:10px;background:var(--panel)}
#now b{color:var(--txt);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qual{padding:6px 8px;font-size:13px;border-radius:10px}
#msg{padding:14px 16px;color:var(--dim);font-size:13px}
#list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 12px 20px}
@media(min-width:700px){#list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.ch{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:14px 6px;color:var(--txt);min-width:0}
.ch:active{background:#000}
.ch.cur{border-color:var(--line2);background:#000;box-shadow:0 0 22px rgba(255,255,255,.06)}
.ch img{width:44px;height:44px;object-fit:contain}
.ch span{font-size:12px;line-height:1.3;width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.logo{width:44px;height:44px;border-radius:50%;background:#06080b;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);font:italic 500 19px Fraunces,Georgia,serif}
#add{display:none;padding:0 14px 12px;gap:8px;flex-wrap:wrap}
#add.show{display:flex}
#add input{flex:1 1 100%}
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="brand">Vimline</span><span class="sp"></span>
    <button id="refresh" title="Reload lists">Refresh</button>
    <button id="plus" title="Add link">+</button>
  </div>
  <div class="sr"><input id="q" type="search" placeholder="Search channels"></div>
  <div id="add"><input id="cname" placeholder="Name (optional)"><input id="url" placeholder="M3U playlist or .m3u8 stream link"><button id="addBtn">Add</button></div>
  <div class="tabs" id="tabs"></div>
</header>
<div id="player"><video id="v" controls playsinline autoplay></video>
  <div id="now"><b id="nm"></b><select id="qual" hidden></select><span id="st"></span></div></div>
<div id="msg">Loading…</div>
<div id="list"></div>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const B='https://iptv-org.github.io/iptv/';
const FILES={bd:'countries/bd',ben:'languages/ben',in:'countries/in',hin:'languages/hin',sports:'categories/sports',movies:'categories/movies',music:'categories/music',news:'categories/news',us:'countries/us',gb:'countries/gb',pk:'countries/pk',np:'countries/np',lk:'countries/lk'};
['kids','animation','entertainment','comedy','series','classic','documentary','science','culture','religious','education','lifestyle','cooking','travel','outdoor','family','general','business','weather'].forEach(k=>FILES[k]='categories/'+k);
const cat=(...k)=>r=>k.flatMap(x=>r[x]);
const KOL=/bangla|bengal|jalsha|ananda|kolkata|calcutta|aath|aakash|24 ?ghanta|sangeet|mahuaa/i;
// Each channel is kept only in the first tab that contains it (top to bottom).
const TABS=[
 {id:'bd',name:'Bangladesh',get:r=>r.bd},
 {id:'kol',name:'Kolkata',get:r=>r.ben.filter(c=>c.cc!=='bd').concat(r.in.filter(c=>KOL.test(c.name)))},
 {id:'sports',name:'Sports',get:cat('sports')},
 {id:'movies',name:'Movies',get:cat('movies')},
 {id:'music',name:'Music',get:cat('music')},
 {id:'news',name:'News',get:cat('news')},
 {id:'kids',name:'Kids',get:cat('kids','animation')},
 {id:'ent',name:'Entertainment',get:cat('entertainment','comedy','series','classic')},
 {id:'life',name:'Lifestyle',get:cat('lifestyle','cooking','travel','outdoor','family')},
 {id:'know',name:'Knowledge',get:cat('documentary','science','culture','education')},
 {id:'rel',name:'Religious',get:cat('religious')},
 {id:'hin',name:'Hindi',get:cat('hin')},
 {id:'sa',name:'South Asia',get:cat('pk','np','lk')},
 {id:'intl',name:'International',get:cat('us','gb','general','business','weather')}
];
const ADULT=/\b(xxx|porn\w*|sex\w*|adult|erotic\w*|playboy|hustler|brazzers|penthouse|nude|nudes|hentai|fetish|18\+|redlight|vivid)\b/i;
const REMOTE='__REMOTE__'; // filled in automatically when the APK is built
const TTL=3*3600*1000, TIMEOUT=6000, WORKERS=8;
let custom=store.get('custom',[]).map(x=>typeof x==='string'?{type:'list',url:x}:x);
let alive=store.get('alive',{});
let base=TABS, raw=null, built={}, cur='bd', hls=null, playing=null, queue=[], token=0;

const norm=n=>n.toLowerCase().replace(/\b(hd|sd|fhd|uhd|4k)\b/g,'').replace(/[^a-z0-9\u0980-\u09ff]/g,'');

function parse(text){
  const map=new Map(),lines=text.split(/\r?\n/);let meta=null;
  for(const l of lines){
    if(l.startsWith('#EXTINF')){
      const name=l.split(',').slice(1).join(',').trim().replace(/\s*\[.*?\]|\s*\(\d+p\)/g,'').trim();
      const logo=(l.match(/tvg-logo="([^"]*)"/)||[])[1]||'';
      const id=(l.match(/tvg-id="([^"]*)"/)||[])[1]||'';
      const cc=id.includes('.')?id.split('.').pop().split('@')[0].toLowerCase():'';
      const grp=(l.match(/group-title="([^"]*)"/)||[])[1]||'';
      meta={name,logo,cc,adult:ADULT.test(name)||/xxx|adult|porn|erotic/i.test(grp)};
    }else if(l&&!l.startsWith('#')&&meta){
      const k=norm(meta.name);
      if(k&&!meta.adult){if(!map.has(k))map.set(k,{...meta,urls:[]});const e=map.get(k);if(!e.urls.includes(l.trim()))e.urls.push(l.trim())}
      meta=null;
    }
  }
  return [...map.values()];
}

async function loadList(url,key,force){
  const ck='cache_'+key;
  if(!force){const c=store.get(ck,null);if(c&&Date.now()-c.t<TTL)return c.list}
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw 0;
    const list=parse(await r.text());
    store.set(ck,{t:Date.now(),list});return list;
  }catch{
    const c=store.get(ck,null);return c?c.list:[];
  }
}

async function boot(force){
  $('msg').textContent='Loading…';$('msg').hidden=false;$('list').innerHTML='';
  try{ // channels.json is kept fresh by the bot; fall back to live lists if it is missing
    const jr=await fetch((REMOTE.startsWith('http')?REMOTE:'')+'channels.json',{cache:'no-store'});
    if(jr.ok){
      const j=await jr.json();
      if(j.tabs&&j.tabs.length){
        base=j.tabs.map(t=>({id:t.id,name:t.name}));built={};
        j.tabs.forEach(t=>built[t.id]=t.channels.filter(c=>!ADULT.test(c.name)));
        if(!base.some(t=>t.id===cur))cur=base[0].id;
        show();return;
      }
    }
  }catch{}
  base=TABS;
  const keys=Object.keys(FILES);
  const lists=await Promise.all(keys.map(k=>loadList(B+FILES[k]+'.m3u',k,force)));
  raw={};keys.forEach((k,i)=>raw[k]=lists[i]);
  const seen=new Map();built={};
  for(const t of TABS){
    built[t.id]=[];
    for(const c of t.get(raw)){
      if(ADULT.test(c.name))continue;
      const k=norm(c.name),e=seen.get(k);
      if(e){c.urls.forEach(u=>{if(!e.urls.includes(u))e.urls.push(u)})}
      else{const n={name:c.name,logo:c.logo,urls:[...c.urls]};seen.set(k,n);built[t.id].push(n)}
    }
  }
  show();
}

const allTabs=()=>base.concat(custom.map((c,i)=>({id:'c'+i,name:c.name||(c.type==='stream'?'My channel ':'My list ')+(i+1),custom:c})));

function drawTabs(){
  $('tabs').innerHTML='';
  allTabs().forEach(t=>{
    const b=document.createElement('button');b.textContent=t.name;
    if(t.id===cur)b.className='on';
    b.onclick=()=>{cur=t.id;show()};
    if(t.custom){
      const x=document.createElement('span');x.textContent=' ×';x.title='Delete';x.style.opacity='.7';
      x.onclick=e=>{e.stopPropagation();if(!confirm('Delete "'+t.name+'"?'))return;
        const i=+t.id.slice(1);custom.splice(i,1);store.set('custom',custom);
        try{Object.keys(localStorage).filter(k=>k.startsWith('cache_c')).forEach(k=>localStorage.removeItem(k))}catch{}
        cur='bd';show()};
      b.append(x);
    }
    $('tabs').append(b);
  });
}

async function probe(u){
  const c=alive[u];if(c&&Date.now()-c.t<TTL)return c.ok;
  let ok=false;const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),TIMEOUT);
  try{
    const r=await fetch(u,{signal:ac.signal,cache:'no-store'});
    if(r.ok){
      let head='';
      if(r.body&&r.body.getReader){const rd=r.body.getReader(),{value}=await rd.read();rd.cancel();head=new TextDecoder().decode(value||new Uint8Array())}
      else head=await r.text();
      ok=head.trimStart().startsWith('#EXTM3U');
    }
  }catch{}
  clearTimeout(tm);alive[u]={ok,t:Date.now()};return ok;
}

function card(c){
  const d=document.createElement('button');d.className='ch'+(playing===c?' cur':'');d._c=c;
  const ph=()=>{const p=document.createElement('div');p.className='logo';p.textContent=c.name.slice(0,1);return p};
  if(c.logo){const i=document.createElement('img');i.loading='lazy';i.alt='';i.src=c.logo;i.onerror=()=>i.replaceWith(ph());d.append(i)}else d.append(ph());
  const s=document.createElement('span');s.textContent=c.name;d.append(s);
  d.onclick=()=>play(c);return d;
}

async function show(){
  drawTabs();
  const my=++token,tab=allTabs().find(t=>t.id===cur);
  $('list').innerHTML='';$('msg').hidden=false;$('msg').textContent='Loading…';
  let items;
  if(tab.custom){
    items=tab.custom.type==='stream'?[{name:tab.name,logo:'',urls:[tab.custom.url]}]:await loadList(tab.custom.url,tab.id,false);
  }else items=built[tab.id]||[];
  if(my!==token)return;
  const q=$('q').value.trim().toLowerCase();
  items=items.filter(c=>!q||c.name.toLowerCase().includes(q));
  const single=tab.custom&&tab.custom.type==='stream';
  let found=0,done=0,i=0;const total=items.length;
  const status=()=>{
    if(found===0&&done>=total)$('msg').textContent=total?'No working channels found. Press Refresh and try again.':'Nothing here yet.';
    else $('msg').textContent=done<total?`Checking channels… ${found} working`:`${found} working channels`;
  };
  const frag=()=>document.createDocumentFragment();
  async function worker(){
    while(i<items.length&&my===token){
      const c=items[i++];
      let ok=single||c.v===1;
      if(!ok){for(const u of c.urls){if(my!==token)return;if(await probe(u)){ok=true;break}}}
      done++;
      if(my!==token)return;
      if(ok&&found<800){found++;$('list').append(card(c))}
      if(done%10===0||done===total){status();store.set('alive',alive)}
    }
  }
  status();
  await Promise.all(Array.from({length:WORKERS},worker));
  if(my===token){status();store.set('alive',alive)}
}

function play(c){
  playing=c;
  queue=c.urls.filter(u=>!(alive[u]&&alive[u].ok===false)).sort((a,b)=>(alive[b]&&alive[b].ok?1:0)-(alive[a]&&alive[a].ok?1:0));
  $('player').classList.add('show');$('nm').textContent=c.name;
  document.querySelectorAll('.ch').forEach(e=>e.classList.toggle('cur',e._c===c));
  next();
}

function fillQuality(levels){
  const sel=$('qual'),seenH=new Set(),opts=[];
  levels.forEach((l,i)=>{if(l.height&&!seenH.has(l.height)){seenH.add(l.height);opts.push([i,l.height])}});
  opts.sort((a,b)=>b[1]-a[1]);
  sel.innerHTML='<option value="-1">Auto</option>'+opts.map(o=>`<option value="${o[0]}">${o[1]}p</option>`).join('');
  sel.value='-1';sel.hidden=opts.length<2;
}
$('qual').onchange=()=>{if(hls)hls.currentLevel=+$('qual').value};

function dropCard(c){document.querySelectorAll('.ch').forEach(e=>{if(e._c===c)e.remove()})}

function next(){
  const v=$('v');
  if(hls){hls.destroy();hls=null}
  $('qual').hidden=true;
  const c=playing,u=queue.shift();
  if(!u){$('st').textContent='Not working';dropCard(c);return}
  $('st').textContent='Starting…';
  let done=false;
  const fail=()=>{if(done)return;done=true;alive[u]={ok:false,t:Date.now()};store.set('alive',alive);$('st').textContent='Trying backup…';next()};
  const timer=setTimeout(fail,8000);
  v.onplaying=()=>{if(done)return;done=true;clearTimeout(timer);$('st').textContent='Live'};
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({startLevel:0,capLevelToPlayerSize:true,maxBufferLength:12,manifestLoadingTimeOut:6000,manifestLoadingMaxRetry:0,levelLoadingMaxRetry:1,fragLoadingMaxRetry:2});
    hls.loadSource(u);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,(e,d)=>{fillQuality(d.levels);v.play().catch(()=>{})});
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){clearTimeout(timer);fail()}});
  }else{
    v.src=u;v.onerror=()=>{clearTimeout(timer);fail()};v.play().catch(()=>{});
  }
}

$('refresh').onclick=()=>{alive={};store.set('alive',alive);boot(true)};
let qt;$('q').oninput=()=>{clearTimeout(qt);qt=setTimeout(show,250)};
$('plus').onclick=()=>$('add').classList.toggle('show');
$('addBtn').onclick=async()=>{
  const u=$('url').value.trim(),name=$('cname').value.trim();
  if(!/^https?:\/\//.test(u))return;
  let type=/\.m3u8(\?|$)/i.test(u)?'stream':'list';
  try{const t=await(await fetch(u)).text();type=t.includes('#EXT-X-')?'stream':'list'}catch{}
  custom.push({type,url:u,name});store.set('custom',custom);
  $('url').value='';$('cname').value='';$('add').classList.remove('show');
  cur='c'+(custom.length-1);show();
};
const fit=()=>{$('player').style.top=document.querySelector('header').offsetHeight+'px'};
fit();addEventListener('resize',fit);new ResizeObserver(fit).observe(document.querySelector('header'));
boot(false);
</script>
</body>
</html>
