<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vimline</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,300;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#090c10;--panel:#0f1318;--panel2:#161b22;--line:rgba(233,230,223,.10);--line2:rgba(233,230,223,.32);--txt:#e9e6df;--dim:#828a94}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Manrope,system-ui,"Noto Sans Bengali",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(9,12,16,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;gap:10px;padding:10px 14px 6px;align-items:center}
.sp{flex:1}
.sr{padding:0 14px 8px}
#q{width:100%;height:38px;padding:0 14px;font-size:15px;border-radius:12px}
.brand{font:italic 300 26px/1 Fraunces,Georgia,serif;letter-spacing:.5px;color:var(--txt);}
input{flex:1;min-width:0;background:#06080b;border:1px solid var(--line);color:var(--txt);padding:11px 14px;border-radius:12px;font:inherit;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
input::placeholder{color:var(--dim)}
input:focus{outline:none;border-color:var(--line2)}
button{background:linear-gradient(180deg,#1b2129,#0f1318);border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:12px;font:500 14px Manrope,sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 14px rgba(0,0,0,.45);transition:border-color .15s,transform .1s}
button:hover{border-color:var(--line2)}
button:active{background:#000;transform:scale(.97)}
button:focus-visible{outline:1px solid var(--line2);outline-offset:2px}
#plus{width:42px;padding:0;font-size:20px;font-weight:300;line-height:1;height:42px;flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:8px 15px;border-radius:999px;box-shadow:none;background:transparent;color:var(--dim)}
.tabs button.on{background:#000;color:var(--txt);border-color:var(--line2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 0 18px rgba(255,255,255,.05)}
#player{background:#000;position:sticky;top:110px;z-index:4;display:none;border-bottom:1px solid var(--line)}
#player.show{display:block}
video{width:100%;max-height:42vh;display:block;background:#000}
#now{padding:10px 14px;font-size:13px;color:var(--dim);display:flex;justify-content:space-between;gap:8px;background:var(--panel)}
#now b{color:var(--txt);font-weight:600}
#msg{padding:18px 14px;color:var(--dim)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px}
.ch{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px 10px;color:var(--txt)}
.ch:active{background:#000}
.ch.cur{border-color:var(--line2);background:#000;box-shadow:0 0 22px rgba(255,255,255,.06)}
.ch img{width:56px;height:56px;object-fit:contain}
.ch span{font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.logo{width:56px;height:56px;border-radius:50%;background:#06080b;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);font:italic 500 22px Fraunces,Georgia,serif}
#add{display:none;padding:0 14px 12px;gap:8px}
#add.show{display:flex}
@media(max-width:480px){#add{flex-wrap:wrap}#add input{flex:1 1 100%}}
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="brand">Vimline</span>
    <span class="sp"></span>
    <button id="refresh" title="Reload lists">Refresh</button>
    <button id="plus" title="Add link">+</button>
  </div>
  <div class="sr"><input id="q" type="search" placeholder="Search channels"></div>
  <div id="add"><input id="cname" placeholder="Name (optional)"><input id="url" placeholder="M3U playlist or .m3u8 stream link"><button id="addBtn">Add</button></div>
  <div class="tabs" id="tabs"></div>
</header>
<div id="player"><video id="v" controls playsinline autoplay></video><div id="now"><b id="nm"></b><span id="st"></span></div></div>
<div id="msg">Loading…</div>
<div id="list"></div>

<script>
const B='https://iptv-org.github.io/iptv/';
const DEFAULT_SOURCES=[
 {id:'bd',name:'Bangladesh',url:B+'countries/bd.m3u'},
 {id:'ben',name:'Bengali',url:B+'languages/ben.m3u'},
 {id:'in',name:'India / Kolkata',url:B+'countries/in.m3u'},
 {id:'hin',name:'Hindi',url:B+'languages/hin.m3u'},
 {id:'sports',name:'Sports',url:B+'categories/sports.m3u'},
 {id:'movies',name:'Movies',url:B+'categories/movies.m3u'},
 {id:'music',name:'Music',url:B+'categories/music.m3u'},
 {id:'news',name:'News',url:B+'categories/news.m3u'},
 {id:'us',name:'USA',url:B+'countries/us.m3u'},
 {id:'gb',name:'UK',url:B+'countries/gb.m3u'}
];
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let custom=store.get('custom',[]).map(x=>typeof x==='string'?{type:'list',url:x}:x);
let dead=store.get('dead',{});
let data={}, cur='bd', hls=null, playing=null, queue=[];

const sources=()=>DEFAULT_SOURCES.concat(custom.map((c,i)=>({id:'c'+i,name:c.name||(c.type==='stream'?'My channel ':'My list ')+(i+1),url:c.url,single:c.type==='stream'})));

function parse(text){
  const out=[],lines=text.split(/\r?\n/);let meta=null;
  for(const l of lines){
    if(l.startsWith('#EXTINF')){
      const name=l.split(',').slice(1).join(',').trim();
      const logo=(l.match(/tvg-logo="([^"]*)"/)||[])[1]||'';
      meta={name:name.replace(/\s*\[.*?\]|\s*\(\d+p\)/g,'').trim(),logo};
    }else if(l&&!l.startsWith('#')&&meta){out.push({...meta,url:l.trim()});meta=null}
  }
  // একই নামের চ্যানেল একত্র করে ব্যাকআপ লিংক রাখা
  const map=new Map();
  for(const c of out){const k=c.name.toLowerCase();if(!map.has(k))map.set(k,{name:c.name,logo:c.logo,urls:[]});map.get(k).urls.push(c.url)}
  return [...map.values()];
}

async function load(src,force){
  const key='cache_'+src.id;
  if(src.single)return [{name:src.name,logo:'',urls:[src.url]}];
  if(!force&&data[src.id])return data[src.id];
  try{
    const r=await fetch(src.url,{cache:'no-store'});
    if(!r.ok)throw 0;
    const list=parse(await r.text());
    store.set(key,list);data[src.id]=list;return list;
  }catch{
    const c=store.get(key,null);   // অফলাইনে আগের লিস্ট
    if(c){data[src.id]=c;return c}
    return [];
  }
}

function tabs(){
  $('tabs').innerHTML='';
  sources().forEach(s=>{
    const b=document.createElement('button');b.textContent=s.name;
    if(s.id===cur)b.className='on';
    b.onclick=()=>{cur=s.id;show()};
    $('tabs').append(b);
  });
}

async function show(force){
  tabs();
  const src=sources().find(s=>s.id===cur);
  $('list').innerHTML='';$('msg').textContent='Loading…';$('msg').hidden=false;
  const list=await load(src,force);
  const q=$('q').value.trim().toLowerCase();
  const items=list.map(c=>({...c,urls:c.urls.filter(u=>!dead[u])}))
    .filter(c=>c.urls.length&&(!q||c.name.toLowerCase().includes(q)));
  if(!items.length){$('msg').textContent=list.length?'No channels found. Press Refresh and try again.':'Could not load the list. Check your connection and press Refresh.';return}
  $('msg').hidden=true;
  const f=document.createDocumentFragment();
  items.slice(0,400).forEach(c=>{
    const d=document.createElement('button');d.className='ch'+(playing&&playing.name===c.name?' cur':'');
    const img=document.createElement('img');img.loading='lazy';img.alt='';
    if(c.logo){img.src=c.logo;img.onerror=()=>img.replaceWith(ph(c))}
    function ph(c){const p=document.createElement('div');p.className='logo';p.textContent=c.name.slice(0,1);return p}
    d.append(c.logo?img:ph(c));
    const s=document.createElement('span');s.textContent=c.name;d.append(s);
    d.onclick=()=>play(c);f.append(d);
  });
  $('list').append(f);
}

function play(c){
  playing=c;queue=[...c.urls];
  $('player').classList.add('show');$('nm').textContent=c.name;
  document.querySelectorAll('.ch').forEach(e=>e.classList.toggle('cur',e.lastChild.textContent===c.name));
  next();
}

function next(){
  const v=$('v');
  if(hls){hls.destroy();hls=null}
  const u=queue.shift();
  if(!u){$('st').textContent='This channel is not working right now';return}
  $('st').textContent='Starting…';
  let done=false;
  const fail=()=>{if(done)return;done=true;dead[u]=Date.now();store.set('dead',dead);$('st').textContent='Trying backup link…';next()};
  const timer=setTimeout(fail,15000);
  const ok=()=>{if(done)return;done=true;clearTimeout(timer);$('st').textContent='Live'};
  v.onplaying=ok;
  if(Hls.isSupported()){
    hls=new Hls({lowLatencyMode:true});
    hls.loadSource(u);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){clearTimeout(timer);fail()}});
  }else{
    v.src=u;v.onerror=()=>{clearTimeout(timer);fail()};v.play().catch(()=>{});
  }
}

$('refresh').onclick=()=>{dead={};store.set('dead',dead);data={};show(true)};
$('q').oninput=()=>show();
$('plus').onclick=()=>$('add').classList.toggle('show');
$('addBtn').onclick=async()=>{
  const u=$('url').value.trim(),name=$('cname').value.trim();
  if(!/^https?:\/\//.test(u))return;
  let type=/\.m3u8(\?|$)/i.test(u)?'stream':'list';
  try{const t=await(await fetch(u)).text();type=t.includes('#EXT-X-')?'stream':'list'}catch{}
  custom.push({type,url:u,name});store.set('custom',custom);
  $('url').value='';$('cname').value='';$('add').classList.remove('show');
  cur='c'+(custom.length-1);show();
};
const fit=()=>{$('player').style.top=document.querySelector('header').offsetHeight+'px'};
fit();addEventListener('resize',fit);new ResizeObserver(fit).observe(document.querySelector('header'));
show();
</script>
</body>
</html>
