name: Build Native APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the app project
        run: unzip -q -o native.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: vimline-native-debug-keystore-v1
      - name: Build debug APK
        working-directory: native
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Vimline-Native-APK
          path: native/app/build/outputs/apk/debug/app-debug.apk
