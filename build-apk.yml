name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html www/index.html
          sed -i "s#__REMOTE__#https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#" www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Put icons in the assets folder
        run: |
          mkdir -p assets
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do
            [ -f "$f" ] && cp "$f" assets/ || true
          done
          ls assets
      - name: Generate app icon and splash
        run: npx --yes @capacitor/assets@3 generate --android
      - run: npx cap sync android
      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: vimline-debug-keystore-v1
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Vimline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
